version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  Pulse360 — Docker Compose
#
#  Services:
#    db       → PostgreSQL 16 (application database)
#    pgadmin  → pgAdmin 4 web UI (optional, comment out if not needed)
#
#  Quick start:
#    cp .env.example .env          # fill in your secrets
#    docker compose up -d          # start in background
#    docker compose logs -f db     # tail db logs
#    docker compose down -v        # tear down + remove volumes
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL database ────────────────────────────────────────────────────
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: pulse360_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume → data persists across container restarts
      - pulse360_pgdata:/var/lib/postgresql/data
      # Mount init scripts folder so changes are reflected on rebuild
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pulse360_net

  # ── pgAdmin (optional web UI) ──────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pulse360_pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pulse360_pgadmin:/var/lib/pgadmin
      # Auto-register the db server on first launch
      - ./database/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - pulse360_net

# ── Named volumes ──────────────────────────────────────────────────────────────
volumes:
  pulse360_pgdata:
    driver: local
  pulse360_pgadmin:
    driver: local

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  pulse360_net:
    driver: bridge
